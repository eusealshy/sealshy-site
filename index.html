<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SEALSHY</title>
  <meta name="description" content="Sealshy" />
  <meta name="theme-color" content="#f4efe6" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4efe6;
      --ink: #1a1814;
      --pen: rgba(20, 18, 16, 0.85);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      cursor: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      z-index: 0;
    }
    canvas#draw, canvas#fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    canvas#draw { z-index: 1; }
    canvas#fx { z-index: 2; }
    .stage {
      position: relative;
      z-index: 3;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
      pointer-events: none;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(3.2rem, 12vw, 7.5rem);
      letter-spacing: -0.03em;
      line-height: 0.95;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    h1 .ch {
      display: inline-block;
      will-change: transform, opacity;
      transform-origin: center center;
    }
    nav {
      display: flex;
      gap: 1.75rem;
      pointer-events: auto;
    }
    nav a {
      color: var(--ink);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 500;
      opacity: 0.55;
      transition: opacity 0.25s ease;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      cursor: none;
      outline: none;
    }
    nav a:hover,
    nav a:focus,
    nav a:active {
      opacity: 1;
      border-bottom-color: var(--ink);
      outline: none;
      background: transparent;
    }
    .cursor {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(20, 18, 16, 0.45);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      left: -100px;
      top: -100px;
    }
    @media (hover: none) {
      body { cursor: auto; }
      .cursor, canvas#fx { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="draw" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <main class="stage">
    <div class="card" id="card">
      <h1 id="title" aria-label="SEALSHY"></h1>
      <nav>
        <a href="https://x.com/eusealshy" target="_blank" rel="noopener noreferrer">Twitter</a>
        <a href="https://instagram.com/eusealshy" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </div>
  </main>
  <script>
    const drawCanvas = document.getElementById("draw");
    const dctx = drawCanvas.getContext("2d");
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");
    const cursorEl = document.getElementById("cursor");
    const title = document.getElementById("title");
    const links = [...document.querySelectorAll("nav a")];
    const PEN = "rgba(20, 18, 16, 0.85)";
    const LINE_W = 2.1;
    const INK_LAG = 0.15;
    const RELEASE_LAG = 0.4;
    const NEAR = 210;
    const DUST = 36;

    "SEALSHY".split("").forEach((c) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = c;
      title.appendChild(s);
    });
    const chars = [...title.querySelectorAll(".ch")];

    let w = 0, h = 0, dpr = 1;
    let mx = 0, my = 0, bx = 0, by = 0;
    let hot = 0;
    let drawing = false, hasInk = false;
    let inkX = 0, inkY = 0, lastX = 0, lastY = 0;
    const dust = [];
    const basePos = new Map();
    const smoothN = new Map();
    let lastTs = 0;

    function sizeCanvas(c, cctx, keep) {
      let saved = null;
      if (keep && c.width) {
        saved = document.createElement("canvas");
        saved.width = c.width;
        saved.height = c.height;
        saved.getContext("2d").drawImage(c, 0, 0);
      }
      c.width = Math.floor(w * dpr);
      c.height = Math.floor(h * dpr);
      c.style.width = w + "px";
      c.style.height = h + "px";
      cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (saved) cctx.drawImage(saved, 0, 0, w, h);
    }

    function seedDust() {
      dust.length = 0;
      for (let i = 0; i < DUST; i++) {
        dust.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: 0,
          vy: 0,
          life: 0.4 + Math.random() * 0.6,
          size: 1 + Math.random() * 1.4,
        });
      }
    }

    function cacheBases() {
      title.style.transform = "none";
      chars.forEach((el) => {
        el.style.transform = "none";
        el.style.opacity = "";
      });
      links.forEach((el) => {
        el.style.transform = "none";
        el.style.opacity = "";
      });
      void title.offsetWidth;
      [...chars, ...links].forEach((el) => {
        const r = el.getBoundingClientRect();
        basePos.set(el, { x: r.left + r.width / 2, y: r.top + r.height / 2, half: r.width / 2 });
      });
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = innerWidth;
      h = innerHeight;
      sizeCanvas(drawCanvas, dctx, true);
      sizeCanvas(canvas, ctx, false);
      mx = bx = w / 2;
      my = by = h / 2;
      seedDust();
      cacheBases();
    }

    resize();
    addEventListener("resize", () => setTimeout(resize, 40));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(cacheBases);

    function overLink(el) {
      return !!(el && el.closest && el.closest("nav a"));
    }

    function strokeTo(x, y) {
      dctx.strokeStyle = PEN;
      dctx.lineWidth = LINE_W;
      dctx.lineCap = "round";
      dctx.lineJoin = "round";
      dctx.beginPath();
      dctx.moveTo(lastX, lastY);
      dctx.lineTo(x, y);
      dctx.stroke();
      lastX = x;
      lastY = y;
    }

    addEventListener("pointerdown", (e) => {
      if (overLink(e.target)) return;
      e.preventDefault();
      drawing = true;
      inkX = lastX = mx = e.clientX;
      inkY = lastY = my = e.clientY;
      hasInk = true;
      dctx.fillStyle = PEN;
      dctx.beginPath();
      dctx.arc(lastX, lastY, LINE_W * 0.5, 0, Math.PI * 2);
      dctx.fill();
    });
    addEventListener("pointerup", () => { drawing = false; hasInk = false; });
    addEventListener("pointercancel", () => { drawing = false; hasInk = false; });
    addEventListener("pointermove", (e) => {
      mx = e.clientX;
      my = e.clientY;
      cursorEl.style.left = mx + "px";
      cursorEl.style.top = my + "px";
    });

    links.forEach((a) => {
      a.addEventListener("pointerenter", () => { hot = 1; });
      a.addEventListener("pointerleave", () => { hot = 0; });
      a.addEventListener("focus", (e) => e.target.blur());
    });

    function nearFactor(dist) {
      return Math.max(0, 1 - dist / NEAR);
    }

    function smoothNear(el, target, dt) {
      let n = smoothN.get(el) || 0;
      if (target >= n) n += (target - n) * Math.min(1, dt / 0.06);
      else n += (target - n) * (1 - Math.exp(-dt / RELEASE_LAG));
      if (n < 0.001) n = 0;
      smoothN.set(el, n);
      return n;
    }

    function frame(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000);
      lastTs = ts;

      bx += (mx - bx) * 0.12;
      by += (my - by) * 0.12;

      if (drawing && hasInk) {
        const k = 1 - Math.exp(-dt / INK_LAG);
        inkX += (mx - inkX) * k;
        inkY += (my - inkY) * k;
        if (Math.hypot(inkX - lastX, inkY - lastY) > 0.4) strokeTo(inkX, inkY);
      }

      ctx.clearRect(0, 0, w, h);
      const boost = hot ? 1.15 : 1;
      const R = 190 * boost;

      // light well (45% of original ~ 0.55 strength already dialed soft)
      ctx.globalCompositeOperation = "multiply";
      const well = ctx.createRadialGradient(bx, by, 0, bx, by, R);
      well.addColorStop(0, "rgba(18,16,14," + (0.15 * boost) + ")");
      well.addColorStop(0.4, "rgba(40,34,28," + (0.08 * boost) + ")");
      well.addColorStop(1, "rgba(244,239,230,0)");
      ctx.fillStyle = well;
      ctx.fillRect(0, 0, w, h);

      ctx.globalCompositeOperation = "source-over";
      const core = ctx.createRadialGradient(bx, by, 0, bx, by, 28 * boost);
      core.addColorStop(0, "rgba(10,9,8," + (0.45 * boost) + ")");
      core.addColorStop(0.6, "rgba(20,18,16,0.1)");
      core.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(bx, by, 28 * boost, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(40,36,32,0.18)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(bx, by, 40 * boost, 12 * boost, 0.35, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "rgba(55,48,40,0.1)";
      ctx.beginPath();
      ctx.ellipse(bx, by, 54 * boost, 16 * boost, -0.2, 0, Math.PI * 2);
      ctx.stroke();

      // dust
      let letterSuck = 0;
      for (let i = 0; i < dust.length; i++) {
        const p = dust[i];
        const dx = bx - p.x;
        const dy = by - p.y;
        const dist = Math.hypot(dx, dy) || 1;
        const pull = 0.04 * (70 / Math.max(dist, 24));
        p.vx = (p.vx + (dx / dist) * pull - (dy / dist) * pull * 0.3) * 0.96;
        p.vy = (p.vy + (dy / dist) * pull + (dx / dist) * pull * 0.3) * 0.96;
        p.x += p.vx;
        p.y += p.vy;
        if (dist < 12) {
          const a = Math.random() * Math.PI * 2;
          const rr = 120 + Math.random() * 160;
          p.x = bx + Math.cos(a) * rr;
          p.y = by + Math.sin(a) * rr;
          p.vx = p.vy = 0;
        }
        const a = Math.min(0.4, (1 - Math.min(dist, 200) / 200) * 0.5) * p.life;
        ctx.fillStyle = "rgba(28,24,20," + a + ")";
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }

      // --- letters: individual suck, no overlap, no CSS filter ---
      const states = chars.map((el, i) => {
        const base = basePos.get(el);
        if (!base) return null;
        const dx = bx - base.x;
        const dy = by - base.y;
        const dist = Math.hypot(dx, dy) || 1;
        const n = smoothNear(el, nearFactor(dist), dt);
        letterSuck = Math.max(letterSuck, n);
        // pull toward ball; strength from THIS letter's nearness
        const force = n * n * 28 + n * 8;
        return {
          el, i, base, n,
          tx: base.x + (dx / dist) * force,
          ty: base.y + (dy / dist) * force,
          zoom: 1 - n * 0.22,
        };
      }).filter(Boolean);

      // keep left-to-right order with minimum gap (anti-stack)
      if (states.length) {
        const gaps = [];
        for (let i = 1; i < states.length; i++) {
          gaps.push(Math.max(10, states[i].base.x - states[i - 1].base.x));
        }
        for (let i = 1; i < states.length; i++) {
          const keep = gaps[i - 1] * Math.max(0.62, Math.min(states[i - 1].zoom, states[i].zoom));
          const minX = states[i - 1].tx + keep;
          if (states[i].tx < minX) states[i].tx = minX;
        }
        for (let i = states.length - 2; i >= 0; i--) {
          const keep = gaps[i] * Math.max(0.62, Math.min(states[i].zoom, states[i + 1].zoom));
          const maxX = states[i + 1].tx - keep;
          if (states[i].tx > maxX) states[i].tx = maxX;
        }

        const now = performance.now();
        for (let i = 0; i < states.length; i++) {
          const s = states[i];
          const ox = s.tx - s.base.x;
          const oy = s.ty - s.base.y;
          const shake = s.n * s.n * 1.04;
          const shx = Math.sin(now * 0.05 + i * 1.7) * shake;
          const shy = Math.cos(now * 0.06 + i * 1.3) * shake * 0.8;
          const rot = Math.sin(now * 0.04 + i) * s.n * 1.6;
          s.el.style.transform =
            "translate(" + (ox + shx).toFixed(2) + "px," + (oy + shy).toFixed(2) + "px) " +
            "scale(" + s.zoom.toFixed(4) + ") rotate(" + rot.toFixed(2) + "deg)";
          s.el.style.opacity = Math.max(0.55, 1 - s.n * 0.4).toFixed(3);
        }
      }

      // light link pull (no filter)
      links.forEach((el) => {
        const base = basePos.get(el);
        if (!base) return;
        const dx = bx - base.x;
        const dy = by - base.y;
        const dist = Math.hypot(dx, dy) || 1;
        const n = smoothNear(el, nearFactor(dist), dt);
        const force = n * n * 12;
        el.style.transform =
          "translate(" + ((dx / dist) * force).toFixed(2) + "px," + ((dy / dist) * force).toFixed(2) + "px) " +
          "scale(" + (1 - n * 0.08).toFixed(4) + ")";
      });

      // extra dust when sucking letters
      const extra = Math.round(DUST * 0.4 * letterSuck);
      for (let i = 0; i < extra && i < dust.length; i++) {
        const p = dust[(i * 3) % dust.length];
        ctx.fillStyle = "rgba(28,24,20,0.25)";
        ctx.fillRect(p.x + 2, p.y - 2, p.size, p.size);
      }

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>

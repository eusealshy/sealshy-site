<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SEALSHY</title>
  <meta name="description" content="Sealshy — its me :)" />
  <meta name="theme-color" content="#f4efe6" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4efe6;
      --ink: #1a1814;
      --muted: #6b645a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      cursor: none;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.4;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      z-index: 0;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.07;
      background-image:
        linear-gradient(rgba(26,24,20,0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26,24,20,0.4) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(ellipse 65% 55% at 50% 50%, #000 15%, transparent 75%);
    }
    canvas#fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    .stage {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(3.2rem, 12vw, 7.5rem);
      letter-spacing: -0.03em;
      line-height: 0.95;
      will-change: transform;
      transition: letter-spacing 0.5s ease;
    }
    .card.hot h1 { letter-spacing: 0.02em; }
    .tag {
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      will-change: transform;
    }
    nav {
      display: flex;
      gap: 1.75rem;
      margin-top: 0.5rem;
    }
    nav a {
      color: var(--ink);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 500;
      opacity: 0.55;
      transition: opacity 0.25s ease;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      will-change: transform;
    }
    nav a:hover {
      opacity: 1;
      border-bottom-color: var(--ink);
      cursor: none;
    }
    .cursor {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(20, 18, 16, 0.85);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      left: -100px;
      top: -100px;
      box-shadow: 0 0 10px rgba(0,0,0,0.25);
    }
    @media (hover: none) {
      body { cursor: auto; }
      .cursor, canvas#fx { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <main class="stage">
    <div class="card" id="card">
      <h1 id="title">SEALSHY</h1>
      <p class="tag" id="tag">its me :)</p>
      <nav>
        <a href="https://x.com/eusealshy" target="_blank" rel="noopener noreferrer">Twitter</a>
        <a href="https://instagram.com/eusealshy" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </div>
  </main>
  <script>
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");
    const cursorEl = document.getElementById("cursor");
    const card = document.getElementById("card");
    const pullables = [
      document.getElementById("title"),
      document.getElementById("tag"),
      ...document.querySelectorAll("nav a"),
    ];

    let w = 0, h = 0, dpr = 1;
    let mx = 0, my = 0, bx = 0, by = 0;
    let hot = 0;
    const dust = [];
    const DUST = 70;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      mx = bx = w / 2;
      my = by = h / 2;
      seedDust();
    }

    function seedDust() {
      dust.length = 0;
      for (let i = 0; i < DUST; i++) {
        dust.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: 0,
          vy: 0,
          life: 0.35 + Math.random() * 0.65,
          size: 0.8 + Math.random() * 1.6,
        });
      }
    }

    resize();
    window.addEventListener("resize", resize);

    window.addEventListener("pointermove", (e) => {
      mx = e.clientX;
      my = e.clientY;
      cursorEl.style.left = mx + "px";
      cursorEl.style.top = my + "px";
    });

    document.querySelectorAll("nav a").forEach((a) => {
      a.addEventListener("pointerenter", () => {
        card.classList.add("hot");
        hot = 1;
      });
      a.addEventListener("pointerleave", () => {
        card.classList.remove("hot");
        hot = 0;
      });
    });

    function pullElement(el, strength) {
      const r = el.getBoundingClientRect();
      const cx = r.left + r.width / 2;
      const cy = r.top + r.height / 2;
      const dx = bx - cx;
      const dy = by - cy;
      const dist = Math.hypot(dx, dy) || 1;
      // gentle suck only when near
      const reach = 280;
      const t = Math.max(0, 1 - dist / reach);
      const force = t * t * strength * (hot ? 1.25 : 1);
      const ox = (dx / dist) * force;
      const oy = (dy / dist) * force;
      const scale = 1 - t * 0.018 * (hot ? 1.4 : 1);
      el.style.transform =
        "translate(" + ox.toFixed(2) + "px," + oy.toFixed(2) + "px) scale(" + scale.toFixed(4) + ")";
    }

    function frame() {
      bx += (mx - bx) * 0.1;
      by += (my - by) * 0.1;

      ctx.clearRect(0, 0, w, h);

      const boost = hot ? 1.2 : 1;
      const R = 220 * boost;

      // soft vignette well — muted brown/black, not neon
      ctx.globalCompositeOperation = "multiply";
      const well = ctx.createRadialGradient(bx, by, 0, bx, by, R);
      well.addColorStop(0, "rgba(18, 16, 14, " + (0.22 * boost) + ")");
      well.addColorStop(0.35, "rgba(40, 34, 28, " + (0.14 * boost) + ")");
      well.addColorStop(0.7, "rgba(60, 52, 42, 0.05)");
      well.addColorStop(1, "rgba(244, 239, 230, 0)");
      ctx.fillStyle = well;
      ctx.fillRect(0, 0, w, h);

      // darker core
      ctx.globalCompositeOperation = "source-over";
      const core = ctx.createRadialGradient(bx, by, 0, bx, by, 42 * boost);
      core.addColorStop(0, "rgba(10, 9, 8, " + (0.55 * boost) + ")");
      core.addColorStop(0.55, "rgba(20, 18, 16, 0.2)");
      core.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(bx, by, 42 * boost, 0, Math.PI * 2);
      ctx.fill();

      // faint accretion ring (desaturated)
      ctx.strokeStyle = "rgba(40, 36, 32, " + (0.18 * boost) + ")";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(bx, by, 58 * boost, 18 * boost, 0.35, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "rgba(55, 48, 40, " + (0.1 * boost) + ")";
      ctx.beginPath();
      ctx.ellipse(bx, by, 78 * boost, 24 * boost, -0.2, 0, Math.PI * 2);
      ctx.stroke();

      // dust getting sucked in
      for (let i = 0; i < dust.length; i++) {
        const p = dust[i];
        const dx = bx - p.x;
        const dy = by - p.y;
        const dist = Math.hypot(dx, dy) || 1;
        const pull = (hot ? 0.055 : 0.035) * (80 / Math.max(dist, 28));
        p.vx += (dx / dist) * pull;
        p.vy += (dy / dist) * pull;
        // slight orbital drag so it spirals
        p.vx += (-dy / dist) * pull * 0.35;
        p.vy += (dx / dist) * pull * 0.35;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.x += p.vx;
        p.y += p.vy;

        if (dist < 14) {
          // respawn at edge of influence
          const a = Math.random() * Math.PI * 2;
          const rr = 160 + Math.random() * 200;
          p.x = bx + Math.cos(a) * rr;
          p.y = by + Math.sin(a) * rr;
          p.vx = 0;
          p.vy = 0;
        }

        const alpha = Math.min(0.45, (1 - Math.min(dist, 240) / 240) * 0.55) * p.life;
        ctx.fillStyle = "rgba(28, 24, 20, " + alpha + ")";
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }

      // gentle gravitational pull on copy
      pullables.forEach((el, i) => {
        const strength = i === 0 ? 14 : 9;
        pullElement(el, strength);
      });

      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>

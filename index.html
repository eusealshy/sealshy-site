<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SEALSHY</title>
  <meta name="description" content="Sealshy" />
  <meta name="theme-color" content="#f4efe6" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #f4efe6; --ink: #1a1814; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; outline: none; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      cursor: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas#draw, canvas#fx {
      position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none;
    }
    canvas#draw { z-index: 1; }
    canvas#fx { z-index: 2; }
    .stage {
      position: relative; z-index: 3; min-height: 100%;
      display: grid; place-items: center; padding: 2rem; text-align: center;
      pointer-events: none;
    }
    .card { display: flex; flex-direction: column; align-items: center; gap: 1.75rem; }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(3.2rem, 12vw, 7.5rem);
      letter-spacing: -0.03em;
      line-height: 0.95;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    h1 .ch {
      display: inline-block;
      transform: translate3d(0,0,0);
      will-change: transform, opacity;
    }
    nav { display: flex; gap: 1.75rem; pointer-events: auto; }
    nav a {
      color: var(--ink); text-decoration: none; font-size: 0.8rem;
      letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500;
      opacity: 0.55; border-bottom: 1px solid transparent; padding-bottom: 2px;
      cursor: none; outline: none;
      transform: translate3d(0,0,0);
    }
    nav a:hover, nav a:focus, nav a:active {
      opacity: 1; border-bottom-color: var(--ink); outline: none; background: transparent;
    }
    .cursor {
      position: fixed; width: 8px; height: 8px; border-radius: 50%;
      background: rgba(20, 18, 16, 0.45);
      transform: translate3d(-50%, -50%, 0);
      pointer-events: none; z-index: 10; left: -100px; top: -100px;
    }
    @media (hover: none) {
      body { cursor: auto; }
      .cursor, canvas#fx { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="draw" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <main class="stage">
    <div class="card">
      <h1 id="title" aria-label="SEALSHY"></h1>
      <nav>
        <a href="https://x.com/eusealshy" target="_blank" rel="noopener noreferrer">Twitter</a>
        <a href="https://instagram.com/eusealshy" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </div>
  </main>
  <script>
    const drawCanvas = document.getElementById("draw");
    const dctx = drawCanvas.getContext("2d", { alpha: true });
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d", { alpha: true });
    const cursorEl = document.getElementById("cursor");
    const title = document.getElementById("title");
    const links = [...document.querySelectorAll("nav a")];
    const PEN = "rgba(20, 18, 16, 0.85)";
    const LINE_W = 2.1;
    const INK_LAG = 0.15;
    const RELEASE_LAG = 0.4;
    const NEAR = 200;
    const DUST = 18;

    "SEALSHY".split("").forEach((c) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = c;
      title.appendChild(s);
    });
    const chars = [...title.querySelectorAll(".ch")];

    let w = 0, h = 0;
    let mx = 0, my = 0, bx = 0, by = 0;
    let hot = 0;
    let drawing = false, hasInk = false;
    let inkX = 0, inkY = 0, lastX = 0, lastY = 0;
    const dust = [];
    const home = []; // fixed slot per letter
    const smoothN = new Array(chars.length).fill(0);
    const linkN = new Array(links.length).fill(0);
    let lastTs = 0;
    let linkHome = [];

    function sizeCanvas(c, cctx, keep) {
      let saved = null;
      if (keep && c.width) {
        saved = document.createElement("canvas");
        saved.width = c.width;
        saved.height = c.height;
        saved.getContext("2d").drawImage(c, 0, 0);
      }
      // dpr 1 = much lighter
      c.width = w;
      c.height = h;
      c.style.width = w + "px";
      c.style.height = h + "px";
      cctx.setTransform(1, 0, 0, 1, 0, 0);
      if (saved) cctx.drawImage(saved, 0, 0, w, h);
    }

    function seedDust() {
      dust.length = 0;
      for (let i = 0; i < DUST; i++) {
        dust.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: 0, vy: 0,
          life: 0.45 + Math.random() * 0.55,
          size: 1 + (i % 2),
        });
      }
    }

    function cacheHomes() {
      chars.forEach((el) => { el.style.transform = "translate3d(0,0,0)"; el.style.opacity = "1"; });
      links.forEach((el) => { el.style.transform = "translate3d(0,0,0)"; });
      void title.offsetWidth;
      home.length = 0;
      chars.forEach((el) => {
        const r = el.getBoundingClientRect();
        home.push({ x: r.left + r.width / 2, y: r.top + r.height / 2, half: Math.max(6, r.width * 0.5) });
      });
      linkHome = links.map((el) => {
        const r = el.getBoundingClientRect();
        return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      });
    }

    function resize() {
      w = innerWidth;
      h = innerHeight;
      sizeCanvas(drawCanvas, dctx, true);
      sizeCanvas(canvas, ctx, false);
      mx = bx = w / 2;
      my = by = h / 2;
      seedDust();
      cacheHomes();
    }

    resize();
    addEventListener("resize", () => setTimeout(resize, 50));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(cacheHomes);

    function overLink(el) {
      return !!(el && el.closest && el.closest("nav a"));
    }

    function strokeTo(x, y) {
      dctx.strokeStyle = PEN;
      dctx.lineWidth = LINE_W;
      dctx.lineCap = "round";
      dctx.lineJoin = "round";
      dctx.beginPath();
      dctx.moveTo(lastX, lastY);
      dctx.lineTo(x, y);
      dctx.stroke();
      lastX = x;
      lastY = y;
    }

    addEventListener("pointerdown", (e) => {
      if (overLink(e.target)) return;
      e.preventDefault();
      drawing = true;
      inkX = lastX = mx = e.clientX;
      inkY = lastY = my = e.clientY;
      hasInk = true;
      dctx.fillStyle = PEN;
      dctx.beginPath();
      dctx.arc(lastX, lastY, LINE_W * 0.5, 0, Math.PI * 2);
      dctx.fill();
    });
    addEventListener("pointerup", () => { drawing = false; hasInk = false; });
    addEventListener("pointercancel", () => { drawing = false; hasInk = false; });
    addEventListener("pointermove", (e) => {
      mx = e.clientX;
      my = e.clientY;
      cursorEl.style.transform = "translate3d(" + mx + "px," + my + "px,0) translate(-50%,-50%)";
    });

    links.forEach((a) => {
      a.addEventListener("pointerenter", () => { hot = 1; });
      a.addEventListener("pointerleave", () => { hot = 0; });
      a.addEventListener("focus", (e) => e.target.blur());
    });

    function nearFactor(dist) {
      return dist >= NEAR ? 0 : 1 - dist / NEAR;
    }

    function frame(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.033, (ts - lastTs) / 1000);
      lastTs = ts;

      bx += (mx - bx) * 0.14;
      by += (my - by) * 0.14;

      if (drawing && hasInk) {
        const k = 1 - Math.exp(-dt / INK_LAG);
        inkX += (mx - inkX) * k;
        inkY += (my - inkY) * k;
        if ((inkX - lastX) * (inkX - lastX) + (inkY - lastY) * (inkY - lastY) > 0.25) {
          strokeTo(inkX, inkY);
        }
      }

      // clear only a padded region around cursor (cheaper than full clear on big screens)
      ctx.clearRect(0, 0, w, h);

      const boost = hot ? 1.12 : 1;
      const R = 170 * boost;

      // small well only (no full-screen multiply fill)
      const coreR = 26 * boost;
      const g = ctx.createRadialGradient(bx, by, 0, bx, by, R);
      g.addColorStop(0, "rgba(18,16,14," + (0.14 * boost) + ")");
      g.addColorStop(0.45, "rgba(40,34,28," + (0.06 * boost) + ")");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(bx, by, R, 0, Math.PI * 2);
      ctx.fill();

      const core = ctx.createRadialGradient(bx, by, 0, bx, by, coreR);
      core.addColorStop(0, "rgba(10,9,8,0.45)");
      core.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(bx, by, coreR, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(40,36,32,0.2)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(bx, by, 36 * boost, 11 * boost, 0.35, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(bx, by, 50 * boost, 15 * boost, -0.2, 0, Math.PI * 2);
      ctx.stroke();

      // few particles
      for (let i = 0; i < DUST; i++) {
        const p = dust[i];
        const dx = bx - p.x;
        const dy = by - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const pull = 0.035 * (60 / Math.max(dist, 20));
        p.vx = (p.vx + (dx / dist) * pull) * 0.95;
        p.vy = (p.vy + (dy / dist) * pull) * 0.95;
        p.x += p.vx;
        p.y += p.vy;
        if (dist < 10) {
          const a = Math.random() * Math.PI * 2;
          const rr = 100 + Math.random() * 140;
          p.x = bx + Math.cos(a) * rr;
          p.y = by + Math.sin(a) * rr;
          p.vx = p.vy = 0;
        }
        const a = (1 - Math.min(dist, 180) / 180) * 0.35 * p.life;
        if (a > 0.02) {
          ctx.fillStyle = "rgba(28,24,20," + a + ")";
          ctx.fillRect(p.x, p.y, p.size, p.size);
        }
      }

      // letters: suck toward ball but NEVER leave their slot enough to stack
      // max drift = 35% of distance to neighbor — cursor in the middle can't collapse them
      let maxN = 0;
      const now = performance.now() * 0.001;
      for (let i = 0; i < chars.length; i++) {
        const h0 = home[i];
        if (!h0) continue;
        const dx = bx - h0.x;
        const dy = by - h0.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const target = nearFactor(dist);
        let n = smoothN[i];
        if (target >= n) n += (target - n) * Math.min(1, dt / 0.06);
        else n += (target - n) * (1 - Math.exp(-dt / RELEASE_LAG));
        if (n < 0.001) n = 0;
        smoothN[i] = n;
        if (n > maxN) maxN = n;

        const leftGap = i > 0 ? h0.x - home[i - 1].x : h0.half * 2;
        const rightGap = i < home.length - 1 ? home[i + 1].x - h0.x : h0.half * 2;
        const maxDriftX = Math.min(leftGap, rightGap) * 0.35;
        const maxDriftY = 22;

        // desired pull
        let ox = (dx / dist) * (n * n * 26 + n * 6);
        let oy = (dy / dist) * (n * n * 26 + n * 6);
        // hard clamp to slot — this is what stops mid-letter stacking
        if (ox > maxDriftX) ox = maxDriftX;
        if (ox < -maxDriftX) ox = -maxDriftX;
        if (oy > maxDriftY) oy = maxDriftY;
        if (oy < -maxDriftY) oy = -maxDriftY;

        const zoom = 1 - n * 0.18;
        const shake = n * n * 0.9;
        const shx = shake ? Math.sin(now * 50 + i * 1.7) * shake : 0;
        const shy = shake ? Math.cos(now * 60 + i * 1.3) * shake * 0.8 : 0;
        const rot = n * Math.sin(now * 40 + i) * 1.4;

        chars[i].style.transform =
          "translate3d(" + (ox + shx).toFixed(2) + "px," + (oy + shy).toFixed(2) + "px,0) " +
          "scale(" + zoom.toFixed(3) + ") rotate(" + rot.toFixed(2) + "deg)";
        chars[i].style.opacity = (Math.max(0.6, 1 - n * 0.35)).toFixed(3);
      }

      for (let i = 0; i < links.length; i++) {
        const h0 = linkHome[i];
        if (!h0) continue;
        const dx = bx - h0.x;
        const dy = by - h0.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const target = nearFactor(dist);
        let n = linkN[i];
        if (target >= n) n += (target - n) * Math.min(1, dt / 0.06);
        else n += (target - n) * (1 - Math.exp(-dt / RELEASE_LAG));
        if (n < 0.001) n = 0;
        linkN[i] = n;
        const force = n * n * 10;
        links[i].style.transform =
          "translate3d(" + ((dx / dist) * force).toFixed(2) + "px," + ((dy / dist) * force).toFixed(2) + "px,0)";
      }

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sealshy</title>
  <meta name="description" content="Sealshy" />
  <meta name="theme-color" content="#f4efe6" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/favicon-32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #f4efe6; --ink: #1a1814; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; outline: none; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      cursor: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas#draw, canvas#fx {
      position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none;
    }
    canvas#draw { z-index: 1; }
    canvas#fx { z-index: 2; }
    .stage {
      position: relative; z-index: 3; min-height: 100%;
      display: grid; place-items: center; padding: 2rem; text-align: center;
      pointer-events: none;
    }
    .card { display: flex; flex-direction: column; align-items: center; gap: 1.75rem; }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(3.2rem, 12vw, 7.5rem);
      letter-spacing: -0.03em;
      line-height: 0.95;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    h1 .ch { display: inline-block; transform: translate3d(0,0,0); }
    nav { display: flex; gap: 1.75rem; pointer-events: auto; }
    nav a {
      color: var(--ink); text-decoration: none; font-size: 0.8rem;
      letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500;
      opacity: 0.55; border-bottom: 1px solid transparent; padding-bottom: 2px;
      cursor: none; outline: none; transform: translate3d(0,0,0);
    }
    nav a:hover, nav a:focus, nav a:active {
      opacity: 1; border-bottom-color: var(--ink); outline: none; background: transparent;
    }
    .cursor {
      position: fixed; width: 8px; height: 8px; border-radius: 50%;
      background: rgba(20, 18, 16, 0.45);
      transform: translate3d(-50%, -50%, 0);
      pointer-events: none; z-index: 10; left: 0; top: 0;
      contain: strict;
      opacity: 0;
    }
    @media (hover: none) {
      body { cursor: auto; }
      .cursor, canvas#fx { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="draw" aria-hidden="true"></canvas>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <main class="stage">
    <div class="card">
      <h1 id="title" aria-label="SEALSHY"></h1>
      <nav>
        <a href="https://x.com/eusealshy" target="_blank" rel="noopener noreferrer">Twitter</a>
        <a href="https://instagram.com/eusealshy" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </div>
  </main>
  <script>
    const drawCanvas = document.getElementById("draw");
    const dctx = drawCanvas.getContext("2d", { alpha: true, desynchronized: true });
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
    const cursorEl = document.getElementById("cursor");
    const title = document.getElementById("title");
    const links = [...document.querySelectorAll("nav a")];
    const PEN = "rgba(20, 18, 16, 0.85)";
    const LINE_W = 2.1;
    const INK_LAG = 0.1;
    const RELEASE_LAG = 0.4;
    const NEAR = 200;
    const DUST = 96; // ~90% of full black-hole dust
    const MAX_SEG = 48; // never draw a giant trail line

    "SEALSHY".split("").forEach((c) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = c;
      title.appendChild(s);
    });
    const chars = [...title.querySelectorAll(".ch")];

    let w = 0, h = 0;
    let mx = 0, my = 0, bx = 0, by = 0;
    let hot = 0;
    let drawing = false, hasInk = false;
    let inkX = 0, inkY = 0, lastX = 0, lastY = 0;
    const dust = new Float32Array(DUST * 5); // x,y,vx,vy,life packed — less GC
    const home = new Array(chars.length);
    const smoothN = new Float32Array(chars.length);
    const linkN = new Float32Array(links.length);
    let linkHome = new Array(links.length);
    let lastTs = 0;
    let raf = 0;
    let visible = true;
    let moving = false;
    let lastMove = 0;
    let needsLetterReset = false;
    let pointerLive = false; // effect off until first real mouse move

    function initDust() {
      for (let i = 0; i < DUST; i++) {
        const o = i * 5;
        dust[o] = Math.random() * w;
        dust[o + 1] = Math.random() * h;
        dust[o + 2] = 0;
        dust[o + 3] = 0;
        dust[o + 4] = 0.45 + Math.random() * 0.55;
      }
    }

    function fitCanvas(c) {
      if (c.width === w && c.height === h) return false;
      c.width = w;
      c.height = h;
      c.style.width = w + "px";
      c.style.height = h + "px";
      return true;
    }

    function cacheHomes() {
      chars.forEach((el) => {
        el.style.transform = "translate3d(0,0,0)";
        el.style.opacity = "1";
      });
      links.forEach((el) => { el.style.transform = "translate3d(0,0,0)"; });
      void title.offsetWidth;
      chars.forEach((el, i) => {
        const r = el.getBoundingClientRect();
        home[i] = { x: r.left + r.width / 2, y: r.top + r.height / 2, half: Math.max(6, r.width * 0.5) };
      });
      links.forEach((el, i) => {
        const r = el.getBoundingClientRect();
        linkHome[i] = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      });
      needsLetterReset = false;
    }

    function resize() {
      w = innerWidth | 0;
      h = innerHeight | 0;
      // resizing clears draw canvas — avoids stretch bugs / temp-canvas leaks
      fitCanvas(drawCanvas);
      fitCanvas(canvas);
      drawing = false;
      hasInk = false;
      mx = bx = w * 0.5;
      my = by = h * 0.5;
      lastX = inkX = mx;
      lastY = inkY = my;
      initDust();
      cacheHomes();
    }

    resize();
    let resizeTimer = 0;
    addEventListener("resize", () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 80);
    });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(cacheHomes);

    function overLink(el) {
      return !!(el && el.closest && el.closest("nav a"));
    }

    function strokeTo(x, y) {
      const dx = x - lastX;
      const dy = y - lastY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 0.35) return;
      // jump instead of drawing a screen-wide bug line
      if (dist > MAX_SEG) {
        lastX = x;
        lastY = y;
        return;
      }
      dctx.strokeStyle = PEN;
      dctx.lineWidth = LINE_W;
      dctx.lineCap = "round";
      dctx.lineJoin = "round";
      dctx.beginPath();
      dctx.moveTo(lastX, lastY);
      dctx.lineTo(x, y);
      dctx.stroke();
      lastX = x;
      lastY = y;
    }

    addEventListener("pointerdown", (e) => {
      if (overLink(e.target)) return;
      e.preventDefault();
      if (!pointerLive) {
        pointerLive = true;
        cursorEl.style.opacity = "1";
        initDust();
      }
      drawing = true;
      mx = bx = e.clientX;
      my = by = e.clientY;
      inkX = lastX = mx;
      inkY = lastY = my;
      hasInk = true;
      moving = true;
      lastMove = performance.now();
      cursorEl.style.transform = "translate3d(" + mx + "px," + my + "px,0) translate(-50%,-50%)";
      dctx.fillStyle = PEN;
      dctx.beginPath();
      dctx.arc(lastX, lastY, LINE_W * 0.5, 0, Math.PI * 2);
      dctx.fill();
    });
    addEventListener("pointerup", () => { drawing = false; hasInk = false; });
    addEventListener("pointercancel", () => { drawing = false; hasInk = false; });
    addEventListener("pointermove", (e) => {
      // ignore synthetic/zero moves before the user actually aims
      if (!pointerLive) {
        pointerLive = true;
        mx = bx = e.clientX;
        my = by = e.clientY;
        inkX = lastX = mx;
        inkY = lastY = my;
        cursorEl.style.opacity = "1";
        initDust(); // spawn around first contact, not page center
      } else {
        mx = e.clientX;
        my = e.clientY;
      }
      moving = true;
      lastMove = performance.now();
      cursorEl.style.transform = "translate3d(" + mx + "px," + my + "px,0) translate(-50%,-50%)";
    });

    links.forEach((a) => {
      a.addEventListener("pointerenter", () => { hot = 1; });
      a.addEventListener("pointerleave", () => { hot = 0; });
      a.addEventListener("focus", (e) => e.target.blur());
    });

    document.addEventListener("visibilitychange", () => {
      visible = document.visibilityState === "visible";
      if (visible && !raf) raf = requestAnimationFrame(frame);
    });

    function nearFactor(dist) {
      return dist >= NEAR ? 0 : 1 - dist / NEAR;
    }

    function frame(ts) {
      raf = 0;
      if (!visible) return;
      raf = requestAnimationFrame(frame);

      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.033, (ts - lastTs) / 1000);
      lastTs = ts;

      const idle = !drawing && (ts - lastMove > 120);
      if (idle) moving = false;

      if (!pointerLive) {
        // pristine landing until the user moves the mouse
        ctx.clearRect(0, 0, w, h);
        return;
      }

      bx += (mx - bx) * 0.14;
      by += (my - by) * 0.14;

      if (drawing && hasInk) {
        const k = 1 - Math.exp(-dt / INK_LAG);
        const nx = inkX + (mx - inkX) * k;
        const ny = inkY + (my - inkY) * k;
        // step in small segments so lag never paints a long slash
        let sx = inkX, sy = inkY;
        const tdx = nx - sx, tdy = ny - sy;
        const td = Math.sqrt(tdx * tdx + tdy * tdy);
        if (td > 0.35) {
          const steps = Math.max(1, Math.ceil(td / MAX_SEG));
          for (let s = 1; s <= steps; s++) {
            const px = sx + (tdx * s) / steps;
            const py = sy + (tdy * s) / steps;
            strokeTo(px, py);
          }
        }
        inkX = nx;
        inkY = ny;
      }

      ctx.clearRect(0, 0, w, h);

      const boost = hot ? 1.12 : 1;
      const R = 170 * boost;
      const g = ctx.createRadialGradient(bx, by, 0, bx, by, R);
      g.addColorStop(0, "rgba(18,16,14," + (0.14 * boost) + ")");
      g.addColorStop(0.45, "rgba(40,34,28," + (0.06 * boost) + ")");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(bx, by, R, 0, Math.PI * 2);
      ctx.fill();

      const coreR = 26 * boost;
      const core = ctx.createRadialGradient(bx, by, 0, bx, by, coreR);
      core.addColorStop(0, "rgba(10,9,8,0.45)");
      core.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(bx, by, coreR, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(40,36,32,0.2)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(bx, by, 36 * boost, 11 * boost, 0.35, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(bx, by, 50 * boost, 15 * boost, -0.2, 0, Math.PI * 2);
      ctx.stroke();

      // peek current letter suck (prev frame smooth) for dust speed boost
      let suckBoost = 1;
      let peek = 0;
      for (let i = 0; i < smoothN.length; i++) if (smoothN[i] > peek) peek = smoothN[i];
      if (peek > 0.02) suckBoost = 1 + 0.3 * peek; // up to 1.3x when fully sucking letters

      // black-hole dust (~90% count); faster near letters
      for (let i = 0; i < DUST; i++) {
        const o = i * 5;
        let x = dust[o], y = dust[o + 1], vx = dust[o + 2], vy = dust[o + 3];
        const life = dust[o + 4];
        const dx = bx - x;
        const dy = by - y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const pull = 0.04 * (70 / Math.max(dist, 18)) * suckBoost;
        vx = (vx + (dx / dist) * pull - (dy / dist) * pull * 0.28) * 0.955;
        vy = (vy + (dy / dist) * pull + (dx / dist) * pull * 0.28) * 0.955;
        x += vx * suckBoost;
        y += vy * suckBoost;
        if (dist < 10) {
          const a = Math.random() * Math.PI * 2;
          const rr = 90 + Math.random() * 150;
          x = bx + Math.cos(a) * rr;
          y = by + Math.sin(a) * rr;
          vx = vy = 0;
        }
        dust[o] = x; dust[o + 1] = y; dust[o + 2] = vx; dust[o + 3] = vy;
        const a = (1 - Math.min(dist, 200) / 200) * 0.42 * life;
        if (a > 0.025) {
          ctx.fillStyle = "rgba(28,24,20," + a + ")";
          ctx.fillRect(x, y, 1 + (i & 1), 1 + (i & 1));
        }
      }

      const now = ts * 0.001;
      let anySuck = false;
      for (let i = 0; i < chars.length; i++) {
        const h0 = home[i];
        if (!h0) continue;
        const dx = bx - h0.x;
        const dy = by - h0.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const target = nearFactor(dist);
        let n = smoothN[i];
        if (target >= n) n += (target - n) * Math.min(1, dt / 0.06);
        else n += (target - n) * (1 - Math.exp(-dt / RELEASE_LAG));
        if (n < 0.001) n = 0;
        smoothN[i] = n;
        if (n > 0.002) anySuck = true;

        if (n === 0 && !needsLetterReset) {
          // already at rest — skip DOM write
          continue;
        }

        const leftGap = i > 0 ? h0.x - home[i - 1].x : h0.half * 2;
        const rightGap = i < home.length - 1 ? home[i + 1].x - h0.x : h0.half * 2;
        const maxDriftX = Math.min(leftGap, rightGap) * 0.35;
        const maxDriftY = 22;

        let ox = (dx / dist) * (n * n * 26 + n * 6);
        let oy = (dy / dist) * (n * n * 26 + n * 6);
        if (ox > maxDriftX) ox = maxDriftX;
        if (ox < -maxDriftX) ox = -maxDriftX;
        if (oy > maxDriftY) oy = maxDriftY;
        if (oy < -maxDriftY) oy = -maxDriftY;

        const zoom = 1 - n * 0.18;
        const shake = n * n * 0.9;
        const shx = shake ? Math.sin(now * 50 + i * 1.7) * shake : 0;
        const shy = shake ? Math.cos(now * 60 + i * 1.3) * shake * 0.8 : 0;
        const rot = n * Math.sin(now * 40 + i) * 1.4;

        if (n === 0) {
          chars[i].style.transform = "translate3d(0,0,0)";
          chars[i].style.opacity = "1";
        } else {
          chars[i].style.transform =
            "translate3d(" + (ox + shx).toFixed(2) + "px," + (oy + shy).toFixed(2) + "px,0) " +
            "scale(" + zoom.toFixed(3) + ") rotate(" + rot.toFixed(2) + "deg)";
          chars[i].style.opacity = (Math.max(0.6, 1 - n * 0.35)).toFixed(3);
        }
      }
      if (!anySuck) needsLetterReset = false;
      else needsLetterReset = true;

      for (let i = 0; i < links.length; i++) {
        const h0 = linkHome[i];
        if (!h0) continue;
        const dx = bx - h0.x;
        const dy = by - h0.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const target = nearFactor(dist);
        let n = linkN[i];
        if (target >= n) n += (target - n) * Math.min(1, dt / 0.06);
        else n += (target - n) * (1 - Math.exp(-dt / RELEASE_LAG));
        if (n < 0.001) n = 0;
        linkN[i] = n;
        if (n === 0) {
          links[i].style.transform = "translate3d(0,0,0)";
          continue;
        }
        const force = n * n * 10;
        links[i].style.transform =
          "translate3d(" + ((dx / dist) * force).toFixed(2) + "px," + ((dy / dist) * force).toFixed(2) + "px,0)";
      }
    }

    raf = requestAnimationFrame(frame);
  </script>
</body>
</html>

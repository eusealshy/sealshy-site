<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SEALSHY</title>
  <meta name="description" content="Sealshy — its me :)" />
  <meta name="theme-color" content="#f4efe6" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4efe6;
      --ink: #1a1814;
      --muted: #6b645a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      cursor: none;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.4;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      z-index: 0;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.07;
      background-image:
        linear-gradient(rgba(26,24,20,0.4) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26,24,20,0.4) 1px, transparent 1px);
      background-size: 52px 52px;
      mask-image: radial-gradient(ellipse 65% 55% at 50% 50%, #000 15%, transparent 75%);
    }
    canvas#fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    .stage {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(3.2rem, 12vw, 7.5rem);
      letter-spacing: -0.03em;
      line-height: 0.95;
      display: flex;
      justify-content: center;
      gap: 0;
    }
    h1 .ch {
      display: inline-block;
      will-change: transform, filter, opacity, text-shadow;
      transform-origin: center center;
    }
    .tag {
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.02em;
      will-change: transform, filter, opacity;
    }
    nav {
      display: flex;
      gap: 1.75rem;
      margin-top: 0.5rem;
    }
    nav a {
      color: var(--ink);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 500;
      opacity: 0.55;
      transition: opacity 0.25s ease;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      will-change: transform, filter, opacity;
    }
    nav a:hover {
      opacity: 1;
      border-bottom-color: var(--ink);
      cursor: none;
    }
    .cursor {
      position: fixed;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(20, 18, 16, 0.85);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      left: -100px;
      top: -100px;
      box-shadow: 0 0 10px rgba(0,0,0,0.25);
    }
    @media (hover: none) {
      body { cursor: auto; }
      .cursor, canvas#fx { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <main class="stage">
    <div class="card" id="card">
      <h1 id="title" aria-label="SEALSHY"></h1>
      <p class="tag" id="tag">its me :)</p>
      <nav>
        <a href="https://x.com/eusealshy" target="_blank" rel="noopener noreferrer">Twitter</a>
        <a href="https://instagram.com/eusealshy" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </div>
  </main>
  <script>
    const canvas = document.getElementById("fx");
    const ctx = canvas.getContext("2d");
    const cursorEl = document.getElementById("cursor");
    const card = document.getElementById("card");
    const title = document.getElementById("title");
    const tag = document.getElementById("tag");
    const links = [...document.querySelectorAll("nav a")];

    // split title into letters
    "SEALSHY".split("").forEach((c) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = c;
      title.appendChild(s);
    });
    const chars = [...title.querySelectorAll(".ch")];
    const softPull = [tag, ...links];

    let w = 0, h = 0, dpr = 1;
    let mx = 0, my = 0, bx = 0, by = 0;
    let hot = 0;
    const dust = [];
    const DUST = 93; // was 70 (+33%)
    const basePos = new Map();

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      mx = bx = w / 2;
      my = by = h / 2;
      seedDust();
      cacheBases();
    }

    function seedDust() {
      dust.length = 0;
      for (let i = 0; i < DUST; i++) {
        dust.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: 0,
          vy: 0,
          life: 0.35 + Math.random() * 0.65,
          size: 0.8 + Math.random() * 1.6,
        });
      }
    }

    function cacheBases() {
      const els = [...chars, ...softPull];
      els.forEach((el) => {
        el.style.transform = "none";
        el.style.filter = "none";
        el.style.opacity = "";
        el.style.textShadow = "none";
      });
      // force layout
      void title.offsetWidth;
      els.forEach((el) => {
        const r = el.getBoundingClientRect();
        basePos.set(el, { x: r.left + r.width / 2, y: r.top + r.height / 2 });
      });
    }

    resize();
    window.addEventListener("resize", () => setTimeout(resize, 40));
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(cacheBases);
    }

    window.addEventListener("pointermove", (e) => {
      mx = e.clientX;
      my = e.clientY;
      cursorEl.style.left = mx + "px";
      cursorEl.style.top = my + "px";
    });

    links.forEach((a) => {
      a.addEventListener("pointerenter", () => {
        card.classList.add("hot");
        hot = 1;
      });
      a.addEventListener("pointerleave", () => {
        card.classList.remove("hot");
        hot = 0;
      });
    });

    function nearFactor(dist) {
      // strong only when close to the well
      const near = 170;
      return Math.max(0, 1 - dist / near);
    }

    function pullAndDecay(el, strength, isChar) {
      const base = basePos.get(el);
      if (!base) return;
      const dx = bx - base.x;
      const dy = by - base.y;
      const dist = Math.hypot(dx, dy) || 1;
      const reach = Math.hypot(w, h) || 1;
      const t = Math.max(0, 1 - dist / reach);
      const n = nearFactor(dist);
      const force = t * strength * (hot ? 1.25 : 1);
      const ox = (dx / dist) * force;
      const oy = (dy / dist) * force;

      // deterioration toward black hole (still readable)
      const blur = n * (isChar ? 1.15 : 0.7);
      const darken = n * 0.28;
      const opac = 1 - n * (isChar ? 0.32 : 0.22);
      const squash = 1 - n * 0.06;
      const stretchX = 1 + n * 0.04;
      const skew = (dx / dist) * n * 4;
      const rot = (isChar ? (Math.sin(dist * 0.05) * n * 3) : 0);

      el.style.transform =
        "translate(" + ox.toFixed(2) + "px," + oy.toFixed(2) + "px) " +
        "scale(" + (squash * stretchX).toFixed(4) + "," + squash.toFixed(4) + ") " +
        "skewX(" + skew.toFixed(2) + "deg) rotate(" + rot.toFixed(2) + "deg)";
      el.style.filter =
        "blur(" + blur.toFixed(2) + "px) brightness(" + (1 - darken).toFixed(3) + ") contrast(" +
        (1 + n * 0.15).toFixed(3) + ")";
      el.style.opacity = Math.max(0.62, opac).toFixed(3);
      if (n > 0.05) {
        const sh = (n * 2.2).toFixed(1);
        el.style.textShadow =
          sh + "px 0 0 rgba(40,34,28," + (0.18 * n).toFixed(2) + "), " +
          "-" + sh + "px 0 0 rgba(20,18,16," + (0.14 * n).toFixed(2) + "), " +
          "0 0 " + (n * 10).toFixed(1) + "px rgba(0,0,0," + (0.2 * n).toFixed(2) + ")";
      } else {
        el.style.textShadow = "none";
      }
    }

    function frame() {
      bx += (mx - bx) * 0.1;
      by += (my - by) * 0.1;

      ctx.clearRect(0, 0, w, h);

      const boost = hot ? 1.2 : 1;
      const R = 275 * boost;

      ctx.globalCompositeOperation = "multiply";
      const well = ctx.createRadialGradient(bx, by, 0, bx, by, R);
      well.addColorStop(0, "rgba(18, 16, 14, " + (0.275 * boost) + ")");
      well.addColorStop(0.35, "rgba(40, 34, 28, " + (0.175 * boost) + ")");
      well.addColorStop(0.7, "rgba(60, 52, 42, 0.05)");
      well.addColorStop(1, "rgba(244, 239, 230, 0)");
      ctx.fillStyle = well;
      ctx.fillRect(0, 0, w, h);

      ctx.globalCompositeOperation = "source-over";
      const core = ctx.createRadialGradient(bx, by, 0, bx, by, 42 * boost);
      core.addColorStop(0, "rgba(10, 9, 8, " + (0.55 * boost) + ")");
      core.addColorStop(0.55, "rgba(20, 18, 16, 0.2)");
      core.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(bx, by, 42 * boost, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(40, 36, 32, " + (0.18 * boost) + ")";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(bx, by, 58 * boost, 18 * boost, 0.35, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "rgba(55, 48, 40, " + (0.1 * boost) + ")";
      ctx.beginPath();
      ctx.ellipse(bx, by, 78 * boost, 24 * boost, -0.2, 0, Math.PI * 2);
      ctx.stroke();

      for (let i = 0; i < dust.length; i++) {
        const p = dust[i];
        const dx = bx - p.x;
        const dy = by - p.y;
        const dist = Math.hypot(dx, dy) || 1;
        const pull = (hot ? 0.069 : 0.044) * (80 / Math.max(dist, 28));
        p.vx += (dx / dist) * pull;
        p.vy += (dy / dist) * pull;
        p.vx += (-dy / dist) * pull * 0.35;
        p.vy += (dx / dist) * pull * 0.35;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.x += p.vx;
        p.y += p.vy;

        if (dist < 14) {
          const a = Math.random() * Math.PI * 2;
          const rr = 160 + Math.random() * 200;
          p.x = bx + Math.cos(a) * rr;
          p.y = by + Math.sin(a) * rr;
          p.vx = 0;
          p.vy = 0;
        }

        const alpha = Math.min(0.45, (1 - Math.min(dist, 240) / 240) * 0.55) * p.life;
        ctx.fillStyle = "rgba(28, 24, 20, " + alpha + ")";
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }

      chars.forEach((el) => pullAndDecay(el, 17.5, true));
      softPull.forEach((el, i) => pullAndDecay(el, 11.25, false));

      requestAnimationFrame(frame);
    }
    frame();
  </script>
</body>
</html>

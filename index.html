<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SEALSHY</title>
  <meta name="description" content="Sealshy — its me :)" />
  <meta name="theme-color" content="#f4efe6" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4efe6;
      --ink: #1a1814;
      --muted: #6b645a;
      --blob: rgba(201, 168, 124, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
      cursor: none;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.45;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
      z-index: 0;
    }
    .blob {
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--blob) 0%, transparent 70%);
      filter: blur(28px);
      pointer-events: none;
      transform: translate(-50%, -50%);
      left: 50%;
      top: 50%;
      z-index: 1;
      transition: width 0.4s ease, height 0.4s ease, background 0.4s ease;
      will-change: left, top;
    }
    .blob.hot {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(180, 140, 100, 0.45) 0%, transparent 70%);
    }
    .stage {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 2rem;
      text-align: center;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }
    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(3.2rem, 12vw, 7.5rem);
      letter-spacing: -0.03em;
      line-height: 0.95;
      mix-blend-mode: multiply;
      transition: letter-spacing 0.5s ease, transform 0.5s ease;
    }
    .card.hot h1 {
      letter-spacing: 0.04em;
      transform: scale(1.02);
    }
    .tag {
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    nav {
      display: flex;
      gap: 1.75rem;
      margin-top: 0.5rem;
    }
    nav a {
      color: var(--ink);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 500;
      opacity: 0.55;
      transition: opacity 0.25s ease;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
    }
    nav a:hover {
      opacity: 1;
      border-bottom-color: var(--ink);
      cursor: none;
    }
    .cursor {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ink);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
      mix-blend-mode: difference;
      left: -100px;
      top: -100px;
    }
    @media (hover: none) {
      body { cursor: auto; }
      .cursor, .blob { display: none; }
    }
  </style>
</head>
<body>
  <div class="blob" id="blob" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <main class="stage">
    <div class="card" id="card">
      <h1>SEALSHY</h1>
      <p class="tag">its me :)</p>
      <nav>
        <a href="https://x.com/eusealshy" target="_blank" rel="noopener noreferrer">Twitter</a>
        <a href="https://instagram.com/eusealshy" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
    </div>
  </main>
  <script>
    const blob = document.getElementById("blob");
    const cursor = document.getElementById("cursor");
    const card = document.getElementById("card");
    let x = innerWidth / 2, y = innerHeight / 2;
    let bx = x, by = y;
    const links = document.querySelectorAll("nav a");

    window.addEventListener("pointermove", (e) => {
      x = e.clientX;
      y = e.clientY;
      cursor.style.left = x + "px";
      cursor.style.top = y + "px";
    });

    links.forEach((a) => {
      a.addEventListener("pointerenter", () => {
        blob.classList.add("hot");
        card.classList.add("hot");
      });
      a.addEventListener("pointerleave", () => {
        blob.classList.remove("hot");
        card.classList.remove("hot");
      });
    });

    (function loop() {
      bx += (x - bx) * 0.08;
      by += (y - by) * 0.08;
      blob.style.left = bx + "px";
      blob.style.top = by + "px";
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
